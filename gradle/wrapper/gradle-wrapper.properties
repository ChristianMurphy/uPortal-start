distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.1-bin.zip
# A CI branch without a Gradle cache fetches the distribution in every job at once, and
# services.gradle.org can take more than 10 s to answer. Wait up to 30 s for each read and
# try 3 more times, 5, 10 and 20 s apart. `./gradlew wrapper` resets these three values
# unless it gets --network-timeout 30000 --retries 3 --retry-back-off-ms 5000.
networkTimeout=30000
retries=3
retryBackOffMs=5000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
