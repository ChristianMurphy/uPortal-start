distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.1-bin.zip
# A CI branch without a Gradle cache fetches the distribution in every job at once, and
# services.gradle.org (it redirects to GitHub releases) can stall or answer 504 for minutes.
# Wait up to 30 s for each read and try 6 more times, 5 s to 160 s apart (about 5 minutes).
# `./gradlew wrapper` resets these three values unless it gets
# --network-timeout 30000 --retries 6 --retry-back-off-ms 5000.
networkTimeout=30000
retries=6
retryBackOffMs=5000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
