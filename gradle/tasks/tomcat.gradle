import org.apache.tools.ant.filters.ReplaceTokens

repositories {
    mavenLocal()
    mavenCentral()
}

configurations {
    tomcat
    shared
}

/*
 * Pluto's container API, container driver API and tag library go to Tomcat's shared/lib, where
 * uPortal and every portlet webapp see them. uPortal builds them itself from the Apache Pluto
 * 2.1.0-M3 sources (uPortal-pluto), with uPortal's fixes: a portlet requested before it has
 * registered no longer stays out of service until Tomcat restarts (MOD-I350). A released uPortal
 * 5.17 doesn't publish them, so with one of those shared/lib keeps Apache's 2.1.0-M3 jars.
 * -PsharedPluto=uPortal or -PsharedPluto=apache chooses explicitly.
 */
String sharedPluto = findProperty('sharedPluto') ?: (uPortalVersion ==~ /5\.17\.\d+/ ? 'apache' : 'uPortal')
List<String> sharedPlutoJars = [
    uPortal: ['container-api', 'container-driver-api', 'taglib'].collect { "org.jasig.portal:uPortal-pluto-${it}:${uPortalVersion}" },
    apache: ['container-api', 'container-driver-api', 'taglib'].collect { "org.apache.portals.pluto:pluto-${it}:${plutoVersion}" },
][sharedPluto]
if (sharedPlutoJars == null) {
    throw new GradleException("sharedPluto is '${sharedPluto}'; use uPortal or apache")
}

dependencies {
    tomcat "org.apache.tomcat:tomcat:${tomcatVersion}@tar.gz"
    shared "javax.ccpp:ccpp:${ccppVersion}"
    // Without their dependencies: the three jars depend only on each other, and uPortal's on JSpecify
    sharedPlutoJars.each { shared(it) { transitive = false } }
    shared "org.apereo.service.persondir:person-directory-api:${personDirectoryVersion}"
    shared "${portletApiDependency}"
}

/*
 * Used by tasks in this file to avoid trying to start the Tomcat service twice, etc.
 */
private boolean verifyTomcatState(Project project, boolean verifyRunning) {
    project.ant {
        condition(property: 'tomcatIsRunning', value: true, else: false) {
            socket(server: 'localhost', port: project.tomcatHttpPort)
        }
        if (Boolean.valueOf(tomcatIsRunning) != verifyRunning) {
            logger.lifecycle("The embedded Tomcat servlet container ${verifyRunning ? 'is not currently' : 'is already'} running; nothing to do")
            throw new StopExecutionException()
        }
    }
}

task tomcatInstall() {
    group = 'Tomcat'
    description = 'Downloads the Apache Tomcat servlet container and performs the necessary configuration steps'
    dependsOn ':portalProperties'
    finalizedBy 'tomcatConfig'

    doLast {
        String serverHome = rootProject.ext['buildProperties'].getProperty('server.home')

        logger.lifecycle("Installing Tomcat servlet container version ${tomcatVersion} to location ${serverHome}")

        File tomcatTmpDir = file('build/tmp/tomcat')

        // Clear & reset the tomcat directory
        tomcatTmpDir.deleteDir()
        tomcatTmpDir.mkdirs()

        File tomcatTarFile = file("${tomcatTmpDir}/tomcat-gunziped.tar")

        // Gunzip the Tomcat binaries
        File tomcatTarGz = configurations.tomcat.files.iterator().next()
        ant.gunzip(src: tomcatTarGz, dest: tomcatTarFile.getPath())

        // Un-archive the tar file
        copy {
            from tarTree(tomcatTarFile.getPath())
            into tomcatTmpDir
        }

        // Clear any previous copy of Tomcat
        file(serverHome).deleteDir()

        // Copy to the final location
        copy {
            from "${tomcatTmpDir}/apache-tomcat-${tomcatVersion}"
            into serverHome
        }
    }
}

task tomcatConfig() {
    group = 'Tomcat'
    description = 'Configures Tomcat servlet container, used to update an existing Tomcat install'
    dependsOn ':portalProperties'

    doLast {
        String serverHome = rootProject.ext['buildProperties'].getProperty('server.home')

        /*
         * Remove Tomcat's documentation and examples, which anyone could open, and its ROOT
         * page, which names the Tomcat version (MOD-I251).  etc/tomcat/webapps/ROOT replaces
         * ROOT with a redirect to the portal.  The manager webapps stay:  they have no users
         * until conf/tomcat-users.xml gets one.
         */
        ['docs', 'examples', 'ROOT'].each { file("${serverHome}/webapps/${it}").deleteDir() }

        //  Configure our settings by overlaying etc/tomcat
        copy {
            from 'etc/tomcat'
            into serverHome
            filesMatching('conf/server.xml') {
                filter(ReplaceTokens, tokens: portTokens)
            }
            filteringCharset = 'ISO-8859-1'  // Leaves every byte other than the tokens as-is
        }

        // Add shared.loader dependencies, after removing the Pluto jars an earlier tomcatConfig put
        // there, Apache's or uPortal's, so that each Pluto class is there once (see sharedPluto)
        delete fileTree("${serverHome}/shared/lib") {
            include 'pluto-container-api-*.jar', 'pluto-container-driver-api-*.jar', 'pluto-taglib-*.jar', 'uPortal-pluto-*.jar'
        }
        copy {
            from configurations.shared
            into "${serverHome}/shared/lib"
        }

        /*
         * Create & initialize the folder that is the default location of {portal.home].  (If
         * another location has been specified, we don't want to mess with that.)
         */
        String portalHomeDir = "${serverHome}/portal"
        file(portalHomeDir).mkdirs()
        copy {
            from 'etc/portal'
            into portalHomeDir
            filesMatching('**/*.properties') {
                filter(ReplaceTokens, tokens: portTokens)
            }
            filteringCharset = 'ISO-8859-1'
        }

        /*
         * Test locales:  -PtestPortalLocales=ar_XB lets users choose locales that the release
         * doesn't offer, such as the right-to-left pseudo-locale ar-XB (MOD-D51, MOD-I234).  It
         * appends them to uPortal's portal_locales in ${portal.home}/uPortal.properties, whose
         * later lines win.  Off unless the property is set:  CI's Playwright jobs set it, and the
         * quickstart and production don't.
         */
        String testLocales = findProperty('testPortalLocales')
        if (testLocales) {
            // uPortal's own list (portal.properties); the test locales come after it
            String portalLocales = 'en_US,fr_FR,es_ES,ja_JP,sv_SE,de_DE,mk_MK,lv_LV'
            File uPortalProperties = file("${portalHomeDir}/uPortal.properties")
            uPortalProperties.append("""

##
## Test locales (-PtestPortalLocales=${testLocales}); not for production.
##
org.apereo.portal.i18n.LocaleManager.portal_locales=${portalLocales},${testLocales}
""", 'ISO-8859-1')
            logger.lifecycle("Added the test locales ${testLocales} to portal_locales in ${uPortalProperties}")
        }
    }
}

task tomcatStart() {
    group = 'Tomcat'
    description = 'Start the embedded Tomcat servlet container'
    dependsOn ':portalProperties'

    /*
     * When we chain tasks together -- which is often convenient -- there are some other tasks that
     * may potentially be included in the Task Graph that really need to complete before we start
     * this one.
     */
    mustRunAfter ':tomcatInstall'
    mustRunAfter allprojects.collect { it.tasks.matching { it.name.equals('tomcatDeploy') } }
    mustRunAfter ':deployPortletApp'
    mustRunAfter ':hsqlStart'
    mustRunAfter allprojects.collect { it.tasks.matching { it.name.equals('dataInit') } }

    doLast {
        verifyTomcatState(rootProject, false)

        String serverHome = rootProject.ext['buildProperties'].getProperty('server.home')
        String portalHome = rootProject.ext['buildProperties'].getProperty('portal.home')
        logger.lifecycle("Starting Tomcat servlet container in ${serverHome}")
        String executable = isWindows ? 'cmd' : './catalina.sh'
        ant.exec(dir: "${serverHome}/bin", executable: executable, spawn: true) {
            env(key: "PORTAL_HOME", value: file(portalHome).getCanonicalPath()) // Must be absolute
            if (isWindows) {
                arg(value: '/c')
                arg(value: 'catalina.bat')
            }
            if (rootProject.hasProperty('with-jpda')) {
                arg(value: 'jpda')
            }
            arg(value: 'start')
        }

        /*
         * Tomcat answers HTTP requests only once it has deployed every webapp, so any answer
         * means that it has started (errorsBeginAt 600 counts a 404 as an answer). Waiting for
         * /uPortal to answer below 400 instead waited out waitfor's 3 minutes whenever uPortal
         * was not deployed or did not start (MOD-I344), and then said it was live.
         */
        String uPortalUrl = "http://localhost:${tomcatHttpPort}/uPortal"
        ant.waitfor(maxwait: 3, maxwaitunit: 'minute', timeoutproperty: 'tomcatStartTimedOut') {
            http(url: uPortalUrl, followRedirects: false, errorsBeginAt: 600)
        }
        if (ant.properties['tomcatStartTimedOut']) {
            logger.lifecycle("Tomcat did not answer at ${uPortalUrl} within 3 minutes")
            return
        }
        int status = uPortalStatus(uPortalUrl)
        if (status >= 200 && status < 400) {
            logger.lifecycle('Tomcat has finished loading webapps, local uPortal server is live')
        } else {
            logger.lifecycle("Tomcat has finished loading webapps, but ${uPortalUrl} answered " +
                    "${status < 0 ? 'nothing' : status}: uPortal is not deployed or did not start " +
                    "(see the logs in ${serverHome}/logs)")
        }
    }
}

/*
 * The HTTP status of the URL without following redirects, or -1 when it doesn't answer.
 */
private int uPortalStatus(String url) {
    HttpURLConnection connection = (HttpURLConnection) new URL(url).openConnection()
    connection.instanceFollowRedirects = false
    connection.connectTimeout = 10_000
    connection.readTimeout = 60_000
    try {
        return connection.responseCode
    } catch (IOException ignored) {
        return -1
    } finally {
        connection.disconnect()
    }
}

task tomcatStop() {
    group = 'Tomcat'
    description = 'Stop the embedded Tomcat servlet container'
    dependsOn ':portalProperties'

    doLast {
        verifyTomcatState(rootProject, true)

        String serverHome = rootProject.ext['buildProperties'].getProperty('server.home')
        logger.lifecycle("Stopping Tomcat servlet container in ${serverHome}")
        String executable = isWindows ? 'cmd' : './shutdown.sh'
        ant.exec(dir: "${serverHome}/bin", executable: executable, spawn: true) {
            if (isWindows) {
                arg(value: '/c')
                arg(value: 'shutdown.bat')
            }
        }
        ant.waitfor() {
            not() {
                http(url: "http://localhost:${tomcatHttpPort}/uPortal", followRedirects: false)
            }
        }
    }
}

task tomcatRestart(dependsOn: ['tomcatStop', 'tomcatStart']) {
    group = 'Tomcat'
    description = 'Restart the embedded Tomcat servlet container'

    tomcatStart.mustRunAfter(tomcatStop)
}

task tomcatClearLogs(type: Delete) {
    group = 'Tomcat'
    description = 'Delete all log files within Tomcat'
    dependsOn ':portalProperties'

    doFirst {
        String serverBase = rootProject.ext['buildProperties'].getProperty('server.base')
        FileTree logsFolder = fileTree("${serverBase}/logs")
        if (logsFolder.isEmpty()) {
            logger.lifecycle('The Tomcat logs directory is empty;  there is noting to delete')
        } else {
            logsFolder.visit { FileVisitDetails details ->
                logger.lifecycle("Deleting ${details.name}")
                delete details.file
            }
        }
    }
}

task tomcatZip {
    group = 'Tomcat'
    description = 'Create a zip file of Tomcat (base) with uPortal and portlets'
    dependsOn ':portalProperties'
    mustRunAfter ':tomcatInstall'
    mustRunAfter allprojects.collect { it.tasks.matching { it.name.equals('tomcatDeploy') } }

    doLast {
        String serverBase = rootProject.ext.buildProperties.getProperty('server.base')
        ant.zip(destfile: 'tomcat-uportal.zip') {
            zipfileset (
                dir: "${serverBase}",
                prefix: 'tomcat',
                excludes: 'logs/**/*, temp/**/*, work/**/*'
            )
        }
    }
}

task tomcatTar {
    group = 'Tomcat'
    description = 'Create a .tar.gz file of Tomcat (base) with uPortal and portlets'
    dependsOn ':portalProperties'
    mustRunAfter ':tomcatInstall'
    mustRunAfter allprojects.collect { it.tasks.matching { it.name.equals('tomcatDeploy') } }

    doLast {
        String serverBase = rootProject.ext.buildProperties.getProperty('server.base')
        ant.tar(destfile: 'tomcat-uportal.tgz', compression: 'gzip', longfile: 'gnu') {
            tarfileset (
                dir: "${serverBase}",
                prefix: 'tomcat',
                excludes: 'logs/**/*, temp/**/*, work/**/*'
            )
        }
    }
}
