apply plugin: 'com.github.node-gradle.node'

node {
    download = true
}

// Base URL for tests/general-config.ts;  an exported PORTAL_BASE_URL wins over tomcatHttpPort
String portalBaseUrl = System.getenv('PORTAL_BASE_URL') ?: "http://localhost:${tomcatHttpPort}/uPortal/"
// The specs drive the login form of the portal's authMode (gradle/tasks/auth.gradle)
Map<String, String> authEnvironment = [
        'AUTH_MODE': authMode,
        'CAS_BASE_URL': System.getenv('CAS_BASE_URL') ?: "${casServerUrl.replaceAll('/+$', '')}/".toString(),
]

task playwrightNpxInstall(type: NpxTask, dependsOn: npmInstall) {
    group = 'Testing'
    description = 'Installs Playwright dependencies. Playwright/test is already installed via npmInstall'

    environment = [
            'PLAYWRIGHT_BROWSERS_PATH': '0'
    ]
    command = 'playwright'
    args = ['install', 'chromium']
}

task playwrightLint(type: NpmTask, dependsOn: npmInstall) {
    group = 'Testing'
    description = 'Lints the tests/ directory across a number of tools. Can also be run as an npm script (see package.json)'

    args = ['run', 'lint']
}

task playwrightFormat(type: NpmTask, dependsOn: npmInstall) {
    group = 'Testing'
    description = 'Formats the files in the tests/ directory via prettier. Can also be run as an npm script (see package.json)'

    args = ['run', 'format']
}

task playwrightRun(type: NpxTask, dependsOn: [
        project.tasks.playwrightNpxInstall,
        project.tasks.playwrightLint,
        ':overlays:uPortal:playwrightSkinFixture',
        ':overlays:uPortal:tomcatDeploy',
]) {
    group = 'Testing'
    description = 'Runs Playwright scripts as per tests/uportal-pw.config.ts'
    environment = [
            'PLAYWRIGHT_BROWSERS_PATH': '0',
            'PORTAL_BASE_URL': portalBaseUrl
    ] + authEnvironment
    command = 'playwright'
    args = ['test', '--config=tests/uportal-pw.config.ts']
}

// prepareSkinResources copies the .less sources into the work dir that
// compileLess0 reads. Order it after the fixture so the regenerated
// playwrightSkin files (not the stale committed copies) get compiled.
// Deferred to projectsEvaluated so the cross-project lookup doesn't trigger
// eager configuration of :overlays:uPortal.
// overlays/uPortal does not create prepareSkinResources when the build runs dataImport (or when
// there is no custom skin), so look it up without failing (MOD-I91: dataImport failed here).
gradle.projectsEvaluated {
    tasks.findByPath(':overlays:uPortal:prepareSkinResources')?.mustRunAfter(
            ':overlays:uPortal:playwrightSkinFixture')
}

// Works best when only a single test is enabled ( test.only(...) )
task playwrightDebug(type: NpxTask, dependsOn: [project.tasks.playwrightNpxInstall, project.tasks.playwrightLint]) {
    group = 'Testing'
    description = 'Runs Playwright scripts as per tests/uportal-pw.config.ts in debug mode'
    environment = [
            'PLAYWRIGHT_BROWSERS_PATH': '0',
            'PORTAL_BASE_URL': portalBaseUrl,
            'PWDEBUG': 'console'
    ] + authEnvironment
    command = 'playwright'
    args = ['test', '--config=tests/uportal-pw.config.ts', '--debug']
}
