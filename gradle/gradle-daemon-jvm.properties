# The Gradle daemon (Gradle 9 needs Java 17 or later) runs on a JDK 21 that Gradle finds on this
# machine, whatever JDK the ./gradlew command itself starts on.  The portal (Tomcat, HSQLDB and
# the data import/export tools) keeps running on the JDK in JAVA_HOME.  See "Prerequisites" in
# README.md.
toolchainVersion=21
