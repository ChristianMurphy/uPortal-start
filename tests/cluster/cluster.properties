#
# Two-node cluster test (tests/cluster/cluster.sh): appended to ${portal.home}/uPortal.properties
# on both nodes. Only test settings live here; the cluster itself (Ehcache 2 replication over
# JGroups, JDBC_PING discovery in the shared database, the UP_MUTEX cluster locks) is uPortal's
# default configuration.
#
# The clustered jobs run every ~7 s instead of every ~60 s, so the test does not wait minutes
# for each run. The server bias (4 x the aggregation period, 28 s here) and the lock-abandonment
# age (60 s, uPortal's default, deliberately not shortened) then decide the failover timing.
org.apereo.portal.events.aggr.PortalEventProcessingManagerImpl.aggregateRawEventsPeriod=7001
org.apereo.portal.events.aggr.PortalEventProcessingManagerImpl.purgeRawEventsPeriod=7013
org.apereo.portal.events.aggr.PortalEventProcessingManagerImpl.purgeEventSessionsPeriod=7019
# Events younger than this are not aggregated yet (default PT30S)
org.apereo.portal.events.aggr.PortalRawEventsAggregatorImpl.aggregationDelay=PT5S
