#
# Database upgrade harness vendor: Microsoft SQL Server 2022 (Developer edition image), a
# copy-migration source (MOD-D25). Keys are described in
# hsqldb.properties. The image has no "create database" setting, so dbSetup creates it through the
# master database.
#
vendor.name=SQL Server 2022
container.image=mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
container.port=1433
container.env=ACCEPT_EULA=Y MSSQL_PID=Developer MSSQL_SA_PASSWORD=uPortal-Harness-1
host.port=15433
jdbc.driver=com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11
hibernate.connection.driver_class=com.microsoft.sqlserver.jdbc.SQLServerDriver
hibernate.connection.url=jdbc:sqlserver://@dbHost@:@dbPort@;databaseName=uportal;encrypt=false
hibernate.connection.username=sa
hibernate.connection.password=uPortal-Harness-1
hibernate.connection.validationQuery=select 1
hibernate.dialect=org.hibernate.dialect.SQLServer2005Dialect
setup.url=jdbc:sqlserver://@dbHost@:@dbPort@;databaseName=master;encrypt=false
setup.username=sa
setup.password=uPortal-Harness-1
setup.sql.1=IF DB_ID('uportal') IS NULL CREATE DATABASE uportal
# The Feedback portlet bundles Hibernate 3.2, which has SQLServerDialect but not the
# SQLServer2005Dialect above: without this its session factory fails, and FEEDBACK_STORE is never
# created (MOD-I108). It reads ${portal.home}/feedback.properties after global.properties.
portlet.feedback.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
