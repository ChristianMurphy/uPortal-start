#
# Database upgrade harness vendor: Microsoft SQL Server 2022 (Developer edition image). Keys are
# described in hsqldb.properties. The image has no "create database" setting, so dbSetup creates
# it through the master database.
#
vendor.name=SQL Server 2022
container.image=mcr.microsoft.com/mssql/server:2022-latest
container.port=1433
container.env=ACCEPT_EULA=Y MSSQL_PID=Developer MSSQL_SA_PASSWORD=uPortal-Harness-1
host.port=15433
jdbc.driver=com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11
hibernate.connection.driver_class=com.microsoft.sqlserver.jdbc.SQLServerDriver
hibernate.connection.url=jdbc:sqlserver://@dbHost@:@dbPort@;databaseName=uportal;encrypt=false
hibernate.connection.username=sa
hibernate.connection.password=uPortal-Harness-1
hibernate.connection.validationQuery=select 1
hibernate.dialect=org.hibernate.dialect.SQLServer2005Dialect
setup.url=jdbc:sqlserver://@dbHost@:@dbPort@;databaseName=master;encrypt=false
setup.username=sa
setup.password=uPortal-Harness-1
setup.sql.1=IF DB_ID('uportal') IS NULL CREATE DATABASE uportal
