#
# Database upgrade harness vendor: Oracle Database XE 21c (gvenzl/oracle-xe), a copy-migration
# source (MOD-D25). Oracle 19c, still common on campuses, has no freely available container image;
# XE 21 is the closest older engine. Keys are described in hsqldb.properties. The image creates
# the uportal user in XEPDB1 (APP_USER).
#
vendor.name=Oracle Database XE 21c
container.image=gvenzl/oracle-xe:21-slim@sha256:ecdf4302ac3d134e1bac5ef6e0c223c2d0f4d4d2b6d551aa79b2346f1ab8f792
container.port=1521
container.env=ORACLE_PASSWORD=uportal-sys APP_USER=uportal APP_USER_PASSWORD=uportal
host.port=15522
jdbc.driver=com.oracle.database.jdbc:ojdbc11:23.9.0.25.07
hibernate.connection.driver_class=oracle.jdbc.OracleDriver
hibernate.connection.url=jdbc:oracle:thin:@//@dbHost@:@dbPort@/XEPDB1
hibernate.connection.username=uportal
hibernate.connection.password=uportal
hibernate.connection.validationQuery=select 1 from dual
hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
# As for oracle-23: LAST_NUMBER is the high-water mark of an adaptively sized sequence cache
verify.sequenceValues=invariant
