#
# Database upgrade harness vendor: the HSQLDB server bundled with uPortal-start
# (./gradlew hsqlStart, listening on hsqlPort). See docs/db-upgrade-harness.md.
#
# Keys:
#   container.*        Docker image and settings used by tests/db/harness.sh
#                      (.github/workflows/db-harness.yml repeats them as service containers)
#   host.port          default host port for @dbPort@ (override with -PdbPort)
#   jdbc.driver        Maven coordinates added to the overlays' 'jdbc' configuration
#   hibernate.*        written to ${portal.home}/global.properties by tomcatConfig;
#                      @dbHost@, @dbPort@, @hsqlPort@ and @hsqldbVersion@ are replaced
#   setup.*            optional statements run before dataInit with an admin connection
#
vendor.name=HSQLDB (bundled with uPortal-start)
container.image=
jdbc.driver=org.hsqldb:hsqldb:@hsqldbVersion@
hibernate.connection.driver_class=org.hsqldb.jdbc.JDBCDriver
hibernate.connection.url=jdbc:hsqldb:hsql://localhost:@hsqlPort@/uPortal
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.connection.validationQuery=select 1 from INFORMATION_SCHEMA.SYSTEM_USERS
hibernate.dialect=org.hibernate.dialect.HSQLDialect
