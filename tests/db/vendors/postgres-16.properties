vendor.name=PostgreSQL 16
container.image=postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
container.port=5432
container.env=POSTGRES_DB=uportal POSTGRES_USER=uportal POSTGRES_PASSWORD=uportal
host.port=15432
jdbc.driver=org.postgresql:postgresql:42.7.11
hibernate.connection.driver_class=org.postgresql.Driver
hibernate.connection.url=jdbc:postgresql://@dbHost@:@dbPort@/uportal
hibernate.connection.username=uportal
hibernate.connection.password=uportal
hibernate.connection.validationQuery=select 1
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
