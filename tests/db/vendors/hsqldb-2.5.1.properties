#
# Database upgrade harness vendor: HSQLDB 2.5.1, the version uPortal-start bundled before it moved
# to 2.7.4; a copy-migration source (MOD-D25). Keys are described in hsqldb.properties.
#
# A 2.5.1 database is served by uPortal-start's own HSQLDB server task run at 2.5.1, on its own port
# and in its own directory, so it never needs to be opened by HSQLDB 2.7.4: 2.7.4 can open it, but
# converts the files when it does, and a copy-migration source is only read. The same arguments
# serve an existing 2.5.1 database for dbMigrate:
#   ./gradlew -PhsqldbVersion=2.5.1 -PhsqlPort=15925 -PhsqlDatabaseDir=<directory> hsqlStart
#
vendor.name=HSQLDB 2.5.1 (uPortal-start's HSQLDB server, run at 2.5.1)
container.image=
gradle.args=-PhsqldbVersion=2.5.1 -PhsqlPort=15925 -PhsqlDatabaseDir=.gradle/hsqldb-2.5.1
host.port=15925
jdbc.driver=org.hsqldb:hsqldb:2.5.1
hibernate.connection.driver_class=org.hsqldb.jdbc.JDBCDriver
hibernate.connection.url=jdbc:hsqldb:hsql://@dbHost@:@dbPort@/uPortal
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.connection.validationQuery=select 1 from INFORMATION_SCHEMA.SYSTEM_USERS
hibernate.dialect=org.hibernate.dialect.HSQLDialect
