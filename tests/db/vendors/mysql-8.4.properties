#
# Database upgrade harness vendor: MySQL 8.4 LTS with MySQL Connector/J, a copy-migration source
# (MOD-D25). Keys are described in hsqldb.properties.
#
vendor.name=MySQL 8.4
container.image=mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
container.port=3306
# uPortal's SQL mixes UP_GROUP and up_group, so MySQL/MariaDB on Linux need case-insensitive
# table names (lower_case_table_names=1), as uPortal's MySQL/MariaDB setup guide required.
container.args=--lower-case-table-names=1
container.env=MYSQL_DATABASE=uportal MYSQL_USER=uportal MYSQL_PASSWORD=uportal MYSQL_ROOT_PASSWORD=uportal-root
host.port=15306
jdbc.driver=com.mysql:mysql-connector-j:8.4.0
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://@dbHost@:@dbPort@/uportal?useSSL=false&allowPublicKeyRetrieval=true
hibernate.connection.username=uportal
hibernate.connection.password=uportal
hibernate.connection.validationQuery=select 1
hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
