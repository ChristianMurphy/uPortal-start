#
# Database upgrade harness vendor: Oracle Database 23ai Free (gvenzl/oracle-free). Keys are
# described in hsqldb.properties. The image creates the uportal user in FREEPDB1 (APP_USER).
#
vendor.name=Oracle Database Free 23 (gvenzl 23-slim, currently 23.26 "26ai")
container.image=gvenzl/oracle-free:23-slim
container.port=1521
container.env=ORACLE_PASSWORD=uportal-sys APP_USER=uportal APP_USER_PASSWORD=uportal
host.port=15521
jdbc.driver=com.oracle.database.jdbc:ojdbc11:23.9.0.25.07
hibernate.connection.driver_class=oracle.jdbc.OracleDriver
hibernate.connection.url=jdbc:oracle:thin:@//@dbHost@:@dbPort@/FREEPDB1
hibernate.connection.username=uportal
hibernate.connection.password=uportal
hibernate.connection.validationQuery=select 1 from dual
hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
# LAST_NUMBER, the value the snapshot reads, is the high-water mark of a sequence cache that
# Oracle sizes by the rate of use, so it differs from run to run
verify.sequenceValues=invariant
