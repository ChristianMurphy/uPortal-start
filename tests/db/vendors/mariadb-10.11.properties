#
# Database upgrade harness vendor: MariaDB 10.11 through MariaDB Connector/J, a copy-migration
# source (MOD-D25). Keys are described in hsqldb.properties.
#
# useMysqlMetadata=true is required by uPortal 5.17: without it the driver reports the product
# "MariaDB", which Hibernate 4.3 cannot map to a dialect ("Unable to determine Dialect to use
# [name=MariaDB, majorVersion=10]"), and dataInit fails. With it, Hibernate sees MySQL 10.11 and
# picks MySQL5Dialect. mariadb-10.6 covers MySQL Connector/J.
#
vendor.name=MariaDB 10.11 (MariaDB Connector/J)
container.image=mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
container.port=3306
# uPortal's SQL mixes UP_GROUP and up_group, so MySQL/MariaDB on Linux need case-insensitive
# table names (lower_case_table_names=1), as uPortal's MySQL/MariaDB setup guide required.
container.args=--character-set-server=utf8mb4 --lower-case-table-names=1
container.env=MARIADB_DATABASE=uportal MARIADB_USER=uportal MARIADB_PASSWORD=uportal MARIADB_ROOT_PASSWORD=uportal-root
host.port=15311
jdbc.driver=org.mariadb.jdbc:mariadb-java-client:3.5.6
hibernate.connection.driver_class=org.mariadb.jdbc.Driver
hibernate.connection.url=jdbc:mariadb://@dbHost@:@dbPort@/uportal?useMysqlMetadata=true
hibernate.connection.username=uportal
hibernate.connection.password=uportal
hibernate.connection.validationQuery=select 1
hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
