#
# Database upgrade harness vendor: MariaDB 10.6 through MySQL Connector/J, the driver uPortal's
# MariaDB setup guide used; a copy-migration source (MOD-D25). Keys are described in
# hsqldb.properties.
#
# MariaDB 10.x announces itself as "5.5.5-10.6.x-MariaDB", so MySQL Connector/J reports major
# version 5 and uPortal's PortalDialectResolver picks MySQL5InnoDBCompressedDialect
# (ROW_FORMAT=COMPRESSED). mariadb-11.4 covers MariaDB Connector/J.
#
vendor.name=MariaDB 10.6 (MySQL Connector/J)
container.image=mariadb:10.6@sha256:23616f0bd3aff922f4dea4130f1d0a09f3571d20b7b36c8f49840672dc309e8c
container.port=3306
# uPortal's SQL mixes UP_GROUP and up_group, so MySQL/MariaDB on Linux need case-insensitive
# table names (lower_case_table_names=1), as uPortal's MySQL/MariaDB setup guide required.
container.args=--character-set-server=utf8mb4 --lower-case-table-names=1
container.env=MARIADB_DATABASE=uportal MARIADB_USER=uportal MARIADB_PASSWORD=uportal MARIADB_ROOT_PASSWORD=uportal-root
host.port=15307
jdbc.driver=com.mysql:mysql-connector-j:8.4.0
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://@dbHost@:@dbPort@/uportal?useSSL=false&allowPublicKeyRetrieval=true
hibernate.connection.username=uportal
hibernate.connection.password=uportal
hibernate.connection.validationQuery=select 1
hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
