#
# Merged with (and taking precedence over) the WAR's own WEB-INF/classes/application.properties;
# Spring Boot reads classpath:/config/application.properties after classpath:/application.properties.
#

# MOD-I62:  NotificationPortlet is a Spring Boot 1.5 WAR deployed into the portal's Tomcat, which
# never uses an embedded servlet container.  Boot's embedded-container auto-configuration still sees
# Tomcat's classes through the common class loader and introspects TomcatEmbeddedServletContainerFactory,
# which links against org.apache.coyote.http11.AbstractHttp11JsseProtocol;  Tomcat 11 removed that
# class, so the portlet fails to deploy there.  Exclude the auto-configuration.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.EmbeddedServletContainerAutoConfiguration
