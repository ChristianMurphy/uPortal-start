# org.apache.pluto.testsuite.ExpectedResults loads this file; MiscTest compares what the portal
# reports with it (tests/ux/portlets/pluto-testsuite.spec.ts runs the suite). The build fills in
# the versions (overlays/pluto-testsuite/build.gradle):
#   serverInfo    PortletContext.getServerInfo(): the portlet container, "Pluto/<version>"
#   version.*     PortletContext.getMajorVersion()/getMinorVersion(): the portlet API the container
#                 implements, 2.0 (JSR-286; 1.0 was JSR-168)
#   portalInfo    PortalContext.getPortalInfo(): "uPortal/<uPortalVersion>"
#   security.*    the container role of the suite's security-role-ref (see the spec for how uPortal
#                 maps roles to groups)

expected.serverInfo = Pluto/@plutoVersion@
expected.version.major = 2
expected.version.minor = 0

expected.portalInfo = uPortal/@uPortalVersion@

expected.security.role=tomcat
expected.security.role.mapped=plutoTestRole
