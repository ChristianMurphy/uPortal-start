import org.apache.tools.ant.filters.ReplaceTokens

apply plugin: 'java'

dependencies {
    runtimeOnly("commons-dbcp:commons-dbcp:${casCommonsDbcpVersion}") {
        exclude group: 'xml-apis', module: 'xml-apis'
        exclude group: 'xerces', module: 'xercesImpl'
    }
    runtimeOnly "net.sf.ehcache:ehcache-core:${casEhcacheVersion}"
    runtimeOnly "org.aspectj:aspectjrt:1.9.7"
    runtimeOnly "org.aspectj:aspectjweaver:1.9.7"
    runtimeOnly "org.jasig.cas:cas-server-webapp:${casServerVersion}@war"
    runtimeOnly("org.jasig.cas:cas-server-extension-clearpass:${casServerVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'javax.xml', module: 'xmldsig'
    }
    runtimeOnly "xerces:xercesImpl:${casXercesImplVersion}"

    implementation "commons-codec:commons-codec:${casCommonsCodecVersion}"
    implementation "commons-collections:commons-collections:${casCommonsCollectionsVersion}"
    implementation "org.jasypt:jasypt:${jasyptVersion}"
    implementation "org.slf4j:slf4j-api:${casSlf4jVersion}"

    compileOnly("org.jasig.cas:cas-server-core:${casServerVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'javax.xml', module: 'xmldsig'
    }
    compileOnly("org.springframework:spring-jdbc:${casSpringVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    compileOnly servletApiDependency

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.easymock:easymock:5.3.0'
    testImplementation("org.jasig.cas:cas-server-core:${casServerVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'javax.xml', module: 'xmldsig'
    }
    testImplementation "org.springframework:spring-jdbc:${casSpringVersion}"
}

configurations {
    // Package the JDBC drivers declared in overlays/build.gradle into WEB-INF/lib
    implementation.extendsFrom jdbc
}

war {
    archiveFileName = 'cas.war'
    exclude 'WEB-INF/lib/cas-client-core-3.2.1.jar'
    exclude 'WEB-INF/lib/commons-collections*jar'
    exclude 'WEB-INF/lib/xml-apis-1.0.b2.jar'
    exclude 'WEB-INF/lib/aspectjrt-1.6.10.jar'
    exclude 'WEB-INF/lib/aspectjweaver-1.6.10.jar'

    // Point CAS at this build's Tomcat and HSQLDB ports (see portTokens in the root build.gradle)
    // and at the portal database: the bundled HSQLDB, or the database harness's -PdbVendor one
    // (gradle/tasks/db.gradle), so that CAS logins work against any vendor
    Map harness = rootProject.ext.dbHarness
    Closure<String> xml = { String s -> (s ?: '').replace('&', '&amp;').replace('"', '&quot;').replace('<', '&lt;') }
    Map<String, String> tokens = rootProject.ext.portTokens + [
        casDbDriver: xml(harness ? harness.driverClass : 'org.hsqldb.jdbc.JDBCDriver'),
        casDbUrl: xml(harness ? harness.url : "jdbc:hsqldb:hsql://localhost:${rootProject.ext.hsqlPort}/uPortal".toString()),
        casDbUser: xml(harness ? harness.username : 'sa'),
        casDbPassword: xml(harness ? harness.password : ''),
    ]
    inputs.properties(tokens)
    filesMatching([
        'WEB-INF/cas.properties',
        'WEB-INF/deployerConfigContext.xml',
        'WEB-INF/spring-configuration/clearpass-configuration.xml',
    ]) {
        filter(ReplaceTokens, tokens: tokens)
    }
    filteringCharset = 'ISO-8859-1'  // Leaves every byte other than the tokens as-is
}
