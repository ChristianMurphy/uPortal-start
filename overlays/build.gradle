import scaldingspoon.gradle.WarOverlayPlugin

subprojects {

    apply plugin: WarOverlayPlugin
    apply plugin: org.apereo.portal.start.gradle.plugins.GradleTomcatDeployPlugin

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }

    warOverlay {
        // Include the jar files in the WAR (default is false).
        includeWarJars = true
    }

    configurations {
        war {}
        jdbc
        shell
        impexp
    }

    dependencies {
        /*
         * Add additional JDBC driver jars to the 'jdbc' configuration below;
         * do not remove the hsqldb driver jar that is already listed.
         */
        jdbc "org.hsqldb:hsqldb:${hsqldbVersion}"
        // The database upgrade harness (-PdbVendor=..., see docs/db-upgrade-harness.md) adds its driver
        if (rootProject.ext.dbHarness) {
            jdbc rootProject.ext.dbHarness.driver
        }

        /*
         * These are nearly the same uPortal dependencies declared by uPortal-webapp;
         * perhaps we should create a uPortal-all module to bundle them all as transitives.
         */
        shell "org.jasig.portal:uPortal-groups-filesystem:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-groups-grouper:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-groups-ldap:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-groups-local:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-groups-smartldap:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-portlets:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-security-authn:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-security-xslt:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-soffit-connector:${uPortalVersion}"
        shell "org.jasig.portal:uPortal-utils-jmx:${uPortalVersion}"

        shell portletApiDependency
        shell servletApiDependency

        shell "org.apache.portals.pluto:pluto-container-driver-api:${plutoVersion}"
        shell "javax.ccpp:ccpp:${ccppVersion}"
    }

    artifacts {
        war tasks.war
    }

    /*
     * Library fixes for Tomcat 11 (Jakarta Pages 4.0), made here while the WARs are still javax and
     * run on Tomcat 9 (MOD-D13).  Each rule applies only to the overlays whose WAR needs it;
     * build/reports/overlay-libraries.txt in each overlay lists what was done.  They belong in the
     * portlet projects themselves;  drop a rule once every bundled WAR has the fix.
     */
    apply plugin: org.apereo.portal.start.gradle.plugins.OverlayLibrariesPlugin
    overlayLibraries {
        /*
         * MOD-I60:  JSTL 1.1.2 (taglibs:standard) links against the JSP 2.0 javax.servlet.jsp.el API
         * that Pages 4.0 removed, so on Tomcat 11 every JSP using <c:set> fails to compile.  Package
         * Apache Taglibs 1.2.5 instead, in every WAR that ships a JSTL:  it removes the duplicate
         * implementations some WARs carry (GlassFish jstl-1.2 next to standard-1.1.2), and the
         * TLD URIs are unchanged.  jstlel keeps the JSTL 1.0 URIs (java.sun.com/jstl/*) that
         * standard-1.1.2 also served, used by pluto-testsuite.
         */
        replace('jstl') {
            jars = ~/(jstl|standard)-1\.[0-9.]+\.jar|taglibs-standard-[a-z]+-[0-9.]+\.jar/
            libraries "org.apache.taglibs:taglibs-standard-impl:${taglibsStandardVersion}",
                    "org.apache.taglibs:taglibs-standard-spec:${taglibsStandardVersion}",
                    "org.apache.taglibs:taglibs-standard-jstlel:${taglibsStandardVersion}"
            reason = 'MOD-I60, JSTL 1.1.2 uses the jsp.el API that Pages 4.0 removed'
        }
    }

    /*
     * Gradle 9 builds the jar of every project that applies 'java' as part of 'assemble';  the
     * overlays only produce WARs.
     */
    tasks.named('jar') {
        enabled = false
    }

    /*
     * Classes compiled in an overlay run in the portal's JVM:  target Java 11, the version uPortal 5
     * is built for, whatever JDK runs Gradle.
     */
    tasks.withType(JavaCompile).configureEach {
        options.release = 11
    }

}
