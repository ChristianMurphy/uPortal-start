##
## Development CAS server for uPortal-start (-PauthMode=cas; see docs/authentication.md).
## Not for production: plain HTTP, static users, and generated signing keys.
##

# Where browsers and uPortal reach CAS.  The port comes from casHttpPort (compose.yaml).
cas.server.name=http://localhost:${CAS_HTTP_PORT:8090}
cas.server.prefix=${cas.server.name}/cas
server.port=${CAS_HTTP_PORT:8090}
server.ssl.enabled=false
# Plain HTTP:  the SSO cookie cannot be marked secure
cas.tgc.secure=false

# The quickstart users, with the same passwords as in the portal database (username = password)
cas.authn.accept.enabled=true
cas.authn.accept.name=uPortal quickstart users
cas.authn.accept.users=admin::admin,faculty::faculty,staff::staff,student::student

# Services allowed to use this CAS:  services/*.json
cas.service-registry.core.init-from-json=true
cas.service-registry.json.location=file:/etc/cas/services

# Logout returns to the portal (logout.redirect in etc/cas/uPortal.properties)
cas.logout.follow-service-redirects=true

# The proxy-granting ticket callback is the portal on localhost
cas.http-client.allow-local-urls=true
