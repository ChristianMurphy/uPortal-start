#
# Development CAS server for uPortal-start's opt-in CAS mode (-PauthMode=cas, docs/authentication.md).
#
#   ./gradlew casStart     # or: CAS_HTTP_PORT=8090 docker compose -f docker/cas/compose.yaml up -d --wait
#   ./gradlew casStop
#
# The official Apereo image, meant for demos and development, configured by config/cas.properties
# (the quickstart users, plain HTTP on CAS_HTTP_PORT) and the service definitions in services/.
# Not for production.
#
services:
  cas:
    # apereo/cas:8.0.2, pinned by digest (the multi-architecture index)
    image: apereo/cas:8.0.2@sha256:5dce4fe37976bfed0ba5f4dd5c77eeda047d60b5608d3c5388fed7cce53796a9
    # The host's network:  browsers and uPortal reach CAS on localhost:CAS_HTTP_PORT, and CAS
    # reaches uPortal's proxy-granting ticket callback on localhost (Linux;  Docker Desktop needs
    # host networking turned on)
    network_mode: host
    environment:
      CAS_HTTP_PORT: ${CAS_HTTP_PORT:-8090}
      JVM_MEM_OPTS: -Xms256m -Xmx1024m
    volumes:
      - ./config/cas.properties:/etc/cas/config/cas.properties:ro
      - ./services:/etc/cas/services:ro
    healthcheck:
      # The image has no curl:  ask for the login page with bash's /dev/tcp
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/$$CAS_HTTP_PORT && printf 'GET /cas/login HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 5s
      retries: 60
