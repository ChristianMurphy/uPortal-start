name: Integration
#
# Tests uPortal-start against uPortal built from source, instead of the released uPortalVersion
# in gradle.properties.example (MOD-D16):
#
#   1. builds uPortal (by default the branch of the same name in <owner>/uPortal, else master)
#      with the JDK its .sdkmanrc names and its own Gradle wrapper, and installs it into
#      ~/.m2, which is uploaded as an artifact;
#   2. runs the full Playwright suite on HSQLDB against that build;
#   3. runs the database upgrade harness (tests/db/harness.sh --portal) on every supported
#      database, comparing with the baseline for the built version: tests/db/snapshots/5.17
#      (recorded from 5.17.10-SNAPSHOT) unless one for its major.minor.patch exists;
#   4. runs the full Playwright suite on PostgreSQL 16 and MariaDB 11.4
#      (tests/db/harness.sh --full-suite);
#   5. G-migrate: fills 5.17 databases on old servers and copies them into current ones with
#      dbMigrate (tests/db/migrate.sh), the pairs coming from tests/db/migrate/matrix.json: a small
#      set on every push, and nightly a set that covers every source version, every target and
#      every pair of vendors.
#
# The harness jobs repeat the structure of db-harness.yml: the service-container settings repeat
# tests/db/vendors/*.properties (image, container port, host.port, environment); keep them in sync.
#
on:
  push:
    branches:
      # Prototype only (MOD-I74): run the integration tests on the modernization
      # integration branches. Drop this trigger before upstreaming.
      - 'ccr-*'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Run the nightly sets: G-migrate on every pair of vendors'
        type: boolean
        required: false
        default: false
      uportal-repository:
        description: 'uPortal repository (owner/name) to build; empty means <this owner>/uPortal'
        required: false
        default: ''
      uportal-ref:
        description: 'Branch, tag or commit of uPortal to build; empty means the branch of the same name, else master'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uportal:
    name: "Build uPortal"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.uportal.outputs.version }}
    steps:
      - name: Choose the uPortal repository and ref
        id: source
        env:
          INPUT_REPOSITORY: ${{ inputs.uportal-repository }}
          INPUT_REF: ${{ inputs.uportal-ref }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          repository="${INPUT_REPOSITORY:-$OWNER/uPortal}"
          if [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          elif git ls-remote --exit-code --heads "https://github.com/$repository" "refs/heads/$BRANCH" > /dev/null; then
            ref="$BRANCH"
          else
            ref=master
          fi
          if ! [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$ref" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "Unexpected repository '$repository' or ref '$ref'" >&2
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout uPortal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      # uPortal's CI matrix includes the JDK its .sdkmanrc pins (java=25.0.4-tem, or
      # java=11.0.30-amzn on a Gradle 6 ref); build with that major version and vendor.
      - name: Read uPortal's JDK
        id: jdk
        run: |
          sdk=$(sed -n 's/^java=//p' .sdkmanrc | tr -d '\r')
          version=${sdk%%.*}
          case "${sdk##*-}" in
            amzn) distribution=corretto ;;
            zulu) distribution=zulu ;;
            *) distribution=temurin ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+$ ]]; then
            echo "Cannot read the JDK from uPortal's .sdkmanrc ('$sdk')" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ steps.jdk.outputs.distribution }}
          java-version: ${{ steps.jdk.outputs.version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # `install` publishes to ~/.m2 on every uPortal build (an alias of publishToMavenLocal
      # since Gradle 9); the tests already ran in uPortal's own CI
      - name: Build and install uPortal
        run: ./gradlew -S --stacktrace --no-daemon --no-parallel install
      - name: Read the uPortal version
        id: uportal
        env:
          REPOSITORY: ${{ steps.source.outputs.repository }}
          REF: ${{ steps.source.outputs.ref }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if ! [[ "$version" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "Unexpected uPortal version '$version'" >&2
            exit 1
          fi
          ls ~/.m2/repository/org/jasig/portal/uPortal-webapp/"$version"/
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built uPortal $version from $REPOSITORY@$REF ($(git rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the uPortal build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal/
          if-no-files-found: error
          retention-days: 7

  plan:
    name: "Plan the database jobs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nightly: ${{ steps.set.outputs.nightly }}
      migrate: ${{ steps.migrate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the push or the nightly set
        id: set
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
        run: echo "nightly=$NIGHTLY" >> "$GITHUB_OUTPUT"
      # Checks the coverage rules too, so a pair list that misses a source or target fails here
      - name: G-migrate pairs
        id: migrate
        env:
          NIGHTLY: ${{ steps.set.outputs.nightly }}
        run: node tests/db/migrate/matrix.mjs "$([ "$NIGHTLY" = true ] && echo nightly || echo push)" >> "$GITHUB_OUTPUT"

  playwright:
    name: "Playwright: hsqldb"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Initialize portal
        run: ./gradlew -i -S portalInit
      - name: Check the deployed uPortal version
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: ls -l ".gradle/tomcat/webapps/uPortal/WEB-INF/lib/uPortal-core-$UPORTAL_VERSION.jar"
      - name: Start Tomcat
        run: ./gradlew -i -S tomcatStart
      - name: Wait for portal
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/uPortal/ | grep -qE "200|302"; then
              echo "Portal is ready"
              exit 0
            fi
            echo "Attempt $i/60 - waiting 2s..."
            sleep 2
          done
          echo "Portal did not become ready after 120s"
          exit 1
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --config=tests/uportal-pw.config.ts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-playwright-hsqldb
          path: |
            playwright-report/
            test-results/
            .gradle/tomcat/logs/
      - name: Stop Tomcat
        if: always()
        run: ./gradlew -i -S tomcatStop

  harness-hsqldb:
    name: "DB harness: hsqldb"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Install npm dependencies
        run: npm ci
      - name: dataInit, snapshot, compare, then run the API specs against the portal
        run: tests/db/harness.sh --portal hsqldb
      - name: Upload snapshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-db-harness-hsqldb
          path: |
            build/db-harness/
            .gradle/tomcat/logs/

  harness-service-container:
    name: "DB harness: ${{ matrix.vendor }}"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: postgres-16
            image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
            port: 5432
            host-port: 15432
          - vendor: sqlserver-2022
            image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
            port: 1433
            host-port: 15433
          - vendor: oracle-23
            image: gvenzl/oracle-free:23-slim@sha256:6d61d267a3b978c24c5ac1790e62e927416a0aec446bd86e4b3a1527562757bd
            port: 1521
            host-port: 15521
    services:
      db:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.host-port }}:${{ matrix.port }}
        # One environment for every image; each image reads only its own variables.
        # Throwaway CI credentials, the same as tests/db/vendors/*.properties.
        env:
          POSTGRES_DB: uportal
          POSTGRES_USER: uportal
          POSTGRES_PASSWORD: uportal
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: uPortal-Harness-1
          ORACLE_PASSWORD: uportal-sys
          APP_USER: uportal
          APP_USER_PASSWORD: uportal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Install npm dependencies
        run: npm ci
      # The service container is already running; dbWait polls JDBC until it accepts connections
      # (Oracle Free and SQL Server need a minute or two after the port opens).
      - name: dataInit, snapshot, compare, then run the API specs against the portal
        env:
          HARNESS_DB_CONTAINER: ${{ job.services.db.id }}
          VENDOR: ${{ matrix.vendor }}
        run: >-
          tests/db/harness.sh --external --portal
          "$VENDOR"
          -- -PdbWaitSeconds=600
      - name: Upload snapshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-db-harness-${{ matrix.vendor }}
          path: |
            build/db-harness/
            .gradle/tomcat/logs/

  # MySQL and MariaDB need a server option (lower_case_table_names=1, which MySQL only accepts
  # when the data directory is created). Service containers cannot pass server arguments, so the
  # harness starts these containers itself with `docker run` (see container.args).
  harness-docker-run:
    name: "DB harness: ${{ matrix.vendor }}"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        vendor:
          - mysql-8.4
          - mariadb-10.6
          - mariadb-11.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Install npm dependencies
        run: npm ci
      - name: Start the database, dataInit, snapshot, compare, then run the API specs
        env:
          VENDOR: ${{ matrix.vendor }}
        run: tests/db/harness.sh --portal "$VENDOR"
      - name: Upload snapshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-db-harness-${{ matrix.vendor }}
          path: |
            build/db-harness/
            .gradle/tomcat/logs/

  # MOD-D16 item 3: the whole Playwright suite with uPortal and the bundled portlets on a real
  # database. The harness starts each database with `docker run` (MariaDB needs container.args).
  playwright-database:
    name: "Playwright: ${{ matrix.vendor }}"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vendor:
          - postgres-16
          - mariadb-11.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start the database, deploy everything, dataInit, compare, then run every spec
        env:
          VENDOR: ${{ matrix.vendor }}
        run: tests/db/harness.sh --full-suite "$VENDOR"
      - name: Upload snapshots, test results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-playwright-${{ matrix.vendor }}
          path: |
            build/db-harness/
            .gradle/tomcat/logs/

  # G-migrate (MOD-D11, MOD-D25): a used 5.17 portal's database on an old server, copied with
  # dbMigrate into a current server and verified; for some pairs the whole Playwright suite then
  # runs on the migrated portal. The pairs come from tests/db/migrate/matrix.json (plan job).
  migrate:
    name: "G-migrate: ${{ matrix.source }} to ${{ matrix.target }}"
    needs: [uportal, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.migrate) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps chromium
      - name: Fill the source, prepare the target, copy, verify${{ matrix.playwright && ', run every spec' || '' }}
        env:
          SOURCE: ${{ matrix.source }}
          TARGET: ${{ matrix.target }}
          PLAYWRIGHT: ${{ matrix.playwright }}
        run: |
          options=()
          if [ "$PLAYWRIGHT" = true ]; then options+=(--playwright); fi
          tests/db/migrate.sh "${options[@]}" "$SOURCE" "$TARGET" -- -PdbWaitSeconds=600
      - name: Upload the report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-migrate-${{ matrix.source }}-to-${{ matrix.target }}
          path: |
            build/db-migrate/
            .gradle/tomcat/logs/
