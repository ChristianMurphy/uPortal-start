            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # MOD-D29: a k6 load baseline (guest browsing, login, portlet rendering) against the stored
  # baseline in tests/load/baseline.json, nightly, on PostgreSQL 18 (docs/load-tests.md)
  load:
    name: "Load baseline: postgres-18"
    needs: [uportal, plan]
    if: ${{ needs.plan.outputs.set == 'nightly' || github.ref_name == 'ccr-43ba0785-hzlrj5-cluster' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # k6's official image, pinned by digest
      K6_IMAGE: grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603 # v2.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Deploy on PostgreSQL 18 and start the portal
        run: |
          # The harness's helpers (tests/db/lib.sh) start the database and the portal
          ROOT=$(pwd)
          GRADLE_EXTRA=()
          HTTP_PORT=8080
          export ROOT HTTP_PORT
          . tests/db/lib.sh
          start_database postgres-18
          use_vendor postgres-18
          gradle -PdbVendor=postgres-18 tomcatInstall tomcatDeploy dbWait dbSetup dataInit -PdbWaitSeconds=600
          start_portal postgres-18
      - name: Run the load scenario
        run: |
          mkdir -p build/load
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/w" -w /w "$K6_IMAGE" \
            run --quiet tests/load/portal.js
      - name: Summary
        if: always()
        run: |
          {
            echo "### Load baseline (k6, PostgreSQL 18)"
            echo '```'
            cat build/load/summary.txt 2> /dev/null || echo "no results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/load/summary.txt ]; then
            echo "::notice title=load observed::$(grep '^observed=' build/load/summary.txt)"
          fi
      - name: Stop the portal
        if: always()
        run: ./gradlew -S tomcatStop -PdbVendor=postgres-18
