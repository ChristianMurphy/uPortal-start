name: Integration
#
# Tests uPortal-start against uPortal built from source, instead of the released uPortalVersion
# in gradle.properties.example (MOD-D16):
#
#   1. builds uPortal (by default the branch of the same name in <owner>/uPortal; for a workstream
#      branch such as ccr-x-topic without one, its parent ccr-x; else master)
#      with the JDK its .sdkmanrc names and its own Gradle wrapper, and installs it into
#      ~/.m2, which is uploaded as an artifact;
#   2. runs the full Playwright suite on HSQLDB against that build;
#   3. runs the database upgrade harness (tests/db/harness.sh --portal) on every 6.0 runtime
#      database (MOD-D25), comparing with the baseline for the built version:
#      tests/db/snapshots/5.17 (recorded from 5.17.10-SNAPSHOT) unless one for its
#      major.minor.patch exists;
#   4. runs the full Playwright suite on PostgreSQL 18 and MariaDB 12.3, and nightly on MySQL 9.7
#      (tests/db/harness.sh --full-suite);
#   5. G-migrate: fills 5.17 databases on old servers and copies them into current ones with
#      dbMigrate (tests/db/migrate.sh), the pairs coming from tests/db/migrate/matrix.json: a small
#      set on every push, and nightly a set that covers every source version, every target and
#      every pair of vendors.
#
# Every database runs as a throwaway container that the scripts start from the image (pinned by
# digest) in tests/db/vendors/<vendor>.properties, or as uPortal-start's own HSQLDB server.
#
# Prototype only (MOD-D30): a workstream branch (ccr-43ba0785-hzlrj5-<topic>) runs a light profile
# to spare the account's runners: the uPortal build, Playwright on HSQLDB, the harness and
# Playwright on PostgreSQL 18, and one cross-vendor G-migrate pair. The integration branch runs
# everything above on every push, and the schedule the nightly sets.
#
on:
  push:
    branches:
      # Prototype only (MOD-I74): run the integration tests on the modernization
      # integration branches. Drop this trigger before upstreaming.
      - 'ccr-*'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Run the nightly sets: G-migrate on every pair of vendors, and the Playwright suite on MySQL 9.7'
        type: boolean
        required: false
        default: false
      uportal-repository:
        description: 'uPortal repository (owner/name) to build; empty means <this owner>/uPortal'
        required: false
        default: ''
      uportal-ref:
        description: 'Branch, tag or commit of uPortal to build; empty means the branch of the same name, else its nearest parent branch (ccr-x-topic -> ccr-x), else master'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Prototype only (MOD-D30): a newer push to a workstream branch cancels the older run.
  cancel-in-progress: ${{ startsWith(github.ref_name, 'ccr-43ba0785-hzlrj5-') }}

jobs:
  uportal:
    name: "Build uPortal"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.uportal.outputs.version }}
    steps:
      - name: Choose the uPortal repository and ref
        id: source
        env:
          INPUT_REPOSITORY: ${{ inputs.uportal-repository }}
          INPUT_REF: ${{ inputs.uportal-ref }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          repository="${INPUT_REPOSITORY:-$OWNER/uPortal}"
          ref="$INPUT_REF"
          # A workstream branch (MOD-D30) such as ccr-x-topic uses uPortal's ccr-x-topic if it
          # exists, else drops one -suffix at a time until a uPortal branch matches (ccr-x).
          candidate="$BRANCH"
          while [ -z "$ref" ] && [ -n "$candidate" ]; do
            if git ls-remote --exit-code --heads "https://github.com/$repository" "refs/heads/$candidate" > /dev/null; then
              ref="$candidate"
            elif [[ "$candidate" == *-* ]]; then
              candidate="${candidate%-*}"
            else
              candidate=""
            fi
          done
          ref="${ref:-master}"
          if ! [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$ref" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "Unexpected repository '$repository' or ref '$ref'" >&2
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout uPortal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      # uPortal's CI matrix includes the JDK its .sdkmanrc pins (java=25.0.4-tem, or
      # java=11.0.30-amzn on a Gradle 6 ref); build with that major version and vendor.
      - name: Read uPortal's JDK
        id: jdk
        run: |
          sdk=$(sed -n 's/^java=//p' .sdkmanrc | tr -d '\r')
          version=${sdk%%.*}
          case "${sdk##*-}" in
            amzn) distribution=corretto ;;
            zulu) distribution=zulu ;;
            *) distribution=temurin ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+$ ]]; then
            echo "Cannot read the JDK from uPortal's .sdkmanrc ('$sdk')" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ steps.jdk.outputs.distribution }}
          java-version: ${{ steps.jdk.outputs.version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # `install` publishes to ~/.m2 on every uPortal build (an alias of publishToMavenLocal
      # since Gradle 9); the tests already ran in uPortal's own CI
      - name: Build and install uPortal
        run: ./gradlew -S --stacktrace --no-daemon --no-parallel install
      - name: Read the uPortal version
        id: uportal
        env:
          REPOSITORY: ${{ steps.source.outputs.repository }}
          REF: ${{ steps.source.outputs.ref }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if ! [[ "$version" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "Unexpected uPortal version '$version'" >&2
            exit 1
          fi
          ls ~/.m2/repository/org/jasig/portal/uPortal-webapp/"$version"/
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built uPortal $version from $REPOSITORY@$REF ($(git rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the uPortal build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal/
          if-no-files-found: error
          retention-days: 7

  plan:
    name: "Plan the database jobs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      set: ${{ steps.set.outputs.set }}
      migrate: ${{ steps.migrate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # nightly: the schedule or a manual nightly run; workstream (prototype only, MOD-D30): a
      # ccr-43ba0785-hzlrj5-<topic> branch; push: everything else
      - name: Choose the set
        id: set
        env:
          SET: ${{ (github.event_name == 'schedule' || inputs.nightly == true) && 'nightly' || startsWith(github.ref_name, 'ccr-43ba0785-hzlrj5-') && 'workstream' || 'push' }}
        run: echo "set=$SET" >> "$GITHUB_OUTPUT"
      # Checks the coverage rules too, so a pair list that misses a source or target fails here
      - name: G-migrate pairs
        id: migrate
        env:
          SET: ${{ steps.set.outputs.set }}
        run: node tests/db/migrate/matrix.mjs "$SET" >> "$GITHUB_OUTPUT"

  playwright:
    name: "Playwright: hsqldb"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Initialize portal
        run: ./gradlew -i -S portalInit
      - name: Check the deployed uPortal version
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: ls -l ".gradle/tomcat/webapps/uPortal/WEB-INF/lib/uPortal-core-$UPORTAL_VERSION.jar"
      - name: Start Tomcat
        run: ./gradlew -i -S tomcatStart
      - name: Wait for portal
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/uPortal/ | grep -qE "200|302"; then
              echo "Portal is ready"
              exit 0
            fi
            echo "Attempt $i/60 - waiting 2s..."
            sleep 2
          done
          echo "Portal did not become ready after 120s"
          exit 1
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --config=tests/uportal-pw.config.ts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-playwright-hsqldb
          path: |
            playwright-report/
            test-results/
            .gradle/tomcat/logs/
      - name: Stop Tomcat
        if: always()
        run: ./gradlew -i -S tomcatStop

  # The in-place upgrade harness (G-db) on every 6.0 runtime database (MOD-D25). The scripts
  # start each database themselves (MySQL and MariaDB need server options that a service container
  # cannot be given), from the pinned image in its vendor file.
  harness:
    name: "DB harness: ${{ matrix.vendor }}"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Prototype only (MOD-D30): a workstream branch runs PostgreSQL 18 only
      matrix:
        vendor: ${{ fromJSON(startsWith(github.ref_name, 'ccr-43ba0785-hzlrj5-') && '["postgres-18"]' || '["hsqldb", "postgres-18", "mysql-9.7", "mariadb-12.3", "sqlserver-2025", "oracle-23"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Install npm dependencies
        run: npm ci
      # dbWait polls JDBC until the database accepts connections (Oracle and SQL Server need a
      # minute or two after their container starts)
      - name: Start the database, dataInit, snapshot, compare, then run the API specs
        env:
          VENDOR: ${{ matrix.vendor }}
        run: tests/db/harness.sh --portal "$VENDOR" -- -PdbWaitSeconds=600
      - name: Upload snapshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-db-harness-${{ matrix.vendor }}
          path: |
            build/db-harness/
            .gradle/tomcat/logs/

  # MOD-D16 item 3: the whole Playwright suite with uPortal and the bundled portlets on a real
  # database: PostgreSQL 18 and MariaDB 12.3 on every push, MySQL 9.7 nightly as well.
  playwright-database:
    name: "Playwright: ${{ matrix.vendor }}"
    needs: [uportal, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Prototype only (MOD-D30): a workstream branch runs PostgreSQL 18 only
      matrix:
        vendor: ${{ fromJSON(needs.plan.outputs.set == 'workstream' && '["postgres-18"]' || needs.plan.outputs.set == 'nightly' && '["postgres-18", "mariadb-12.3", "mysql-9.7"]' || '["postgres-18", "mariadb-12.3"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start the database, deploy everything, dataInit, compare, then run every spec
        env:
          VENDOR: ${{ matrix.vendor }}
        run: tests/db/harness.sh --full-suite "$VENDOR" -- -PdbWaitSeconds=600
      - name: Upload snapshots, test results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-playwright-${{ matrix.vendor }}
          path: |
            build/db-harness/
            .gradle/tomcat/logs/

  # G-migrate (MOD-D11, MOD-D25): a used 5.17 portal's database on an old server, copied with
  # dbMigrate into a current server and verified; for some pairs the whole Playwright suite then
  # runs on the migrated portal. The pairs come from tests/db/migrate/matrix.json (plan job).
  migrate:
    name: "G-migrate: ${{ matrix.source }} to ${{ matrix.target }}"
    needs: [uportal, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.migrate) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        if: ${{ matrix.playwright }}
        run: npx playwright install --with-deps chromium
      - name: Fill the source, prepare the target, copy, verify${{ matrix.playwright && ', run every spec' || '' }}
        env:
          SOURCE: ${{ matrix.source }}
          TARGET: ${{ matrix.target }}
          PLAYWRIGHT: ${{ matrix.playwright }}
        run: |
          options=()
          if [ "$PLAYWRIGHT" = true ]; then options+=(--playwright); fi
          tests/db/migrate.sh "${options[@]}" "$SOURCE" "$TARGET" -- -PdbWaitSeconds=600
      - name: Upload the report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-migrate-${{ matrix.source }}-to-${{ matrix.target }}
          path: |
            build/db-migrate/
            .gradle/tomcat/logs/

  # MOD-D29 item 9: two uPortal nodes on one PostgreSQL 18 database, with uPortal's default
  # cluster configuration (Ehcache replication over JGroups, UP_MUTEX cluster locks). Checks cache
  # invalidation across the nodes, that clustered jobs run once, and lock failover when the node
  # holding a lock dies (tests/cluster/cluster.sh, docs/cluster-tests.md).
  cluster:
    name: "Cluster: two nodes${{ matrix.fault && format(', seeded fault {0}', matrix.fault) || '' }}"
    needs: [uportal, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Nightly, each seeded fault must make the checks meant to catch it fail
        fault: ${{ fromJSON((needs.plan.outputs.set == 'nightly' || github.ref_name == 'ccr-43ba0785-hzlrj5-cluster') && '["", "replication-off", "lock-ignored"]' || '[""]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Deploy two nodes on PostgreSQL 18 and run the cluster checks
        env:
          FAULT: ${{ matrix.fault }}
        run: |
          options=()
          if [ -n "$FAULT" ]; then options+=(--fault "$FAULT"); fi
          tests/cluster/cluster.sh "${options[@]}" -- -PdbWaitSeconds=600
      - name: Summary
        if: always()
        run: |
          {
            echo "### Two-node cluster${FAULT:+, seeded fault $FAULT}"
            echo '```'
            cat build/cluster/results.txt 2> /dev/null || echo "no results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FAULT: ${{ matrix.fault }}
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-cluster${{ matrix.fault && format('-{0}', matrix.fault) || '' }}
          path: build/cluster/

  # MOD-D29: the UI specs on Firefox, WebKit and a phone viewport, the axe-core accessibility
  # ratchet and the visual snapshots of the key pages, nightly, on HSQLDB
  # (docs/browser-a11y-tests.md).
  browsers:
    name: "Browsers: ${{ matrix.suite }}"
    needs: [uportal, plan]
    if: ${{ needs.plan.outputs.set == 'nightly' || github.ref_name == 'ccr-43ba0785-hzlrj5-cluster' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: firefox
            browser: firefox
            args: --config=tests/browsers-pw.config.ts --project=firefox
          - suite: webkit
            browser: webkit
            args: --config=tests/browsers-pw.config.ts --project=webkit
          - suite: phone
            browser: chromium
            args: --config=tests/browsers-pw.config.ts --project=phone
          - suite: a11y
            browser: chromium
            args: --config=tests/a11y-pw.config.ts
          - suite: visual
            browser: chromium
            args: --config=tests/visual-pw.config.ts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: uportal-maven-local
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Initialize portal
        run: ./gradlew -S portalInit
      - name: Start Tomcat
        run: ./gradlew -S tomcatStart
      - name: Install npm dependencies
        run: npm ci
      - name: Install the browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      - name: Run ${{ matrix.suite }}
        env:
          ARGS: ${{ matrix.args }}
        run: |
          read -r -a args <<< "$ARGS"
          npx playwright test "${args[@]}" --reporter=list 2>&1 | tee build-playwright.log
          exit "${PIPESTATUS[0]}"
      - name: Report failures and new snapshots
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          {
            echo "### Browsers: $SUITE"
            echo '```'
            sed -n '/^  [0-9]* \(passed\|failed\|flaky\|skipped\)/,$p' build-playwright.log 2> /dev/null | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The accessibility ratchet prints what it observed; keep it where the run shows it
          grep -o 'observed={.*}' build-playwright.log 2> /dev/null | sort -u | head -n 10 |
            while read -r line; do echo "::warning title=a11y observed::${line:0:4000}"; done
          # A snapshot written by this run (none existed) is printed in the log as base64, between
          # markers, so it can be committed (tests/visual/fetch-snapshots.sh)
          if [ "$SUITE" = visual ]; then
            git status --porcelain --untracked-files=all tests/visual/snapshots | sed 's/^?? //' |
              while read -r file; do
                echo "::notice title=new visual snapshot::$file"
                echo "=== BEGIN SNAPSHOT $file"
                base64 -w 0 "$file"
                echo
                echo "=== END SNAPSHOT $file"
              done
          fi
      - name: Stop Tomcat
        if: always()
        run: ./gradlew -S tomcatStop

  # MOD-D29: SQL statements per key request against tests/query-budget/budgets.json, with
  # p6spy in front of uPortal's JDBC driver in the deployed copy only (docs/query-budgets.md)
  query-budgets:
