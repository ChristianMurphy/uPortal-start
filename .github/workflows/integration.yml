      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Initialize portal
        run: ./gradlew -S portalInit
      - name: Count the statements of each key request
        run: tests/query-budget/run.sh
      - name: Summary
        if: always()
        run: |
          {
