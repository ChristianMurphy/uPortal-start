    needs: [uportal, plan]
    # Prototype only (MOD-D30): on a workstream branch (ccr-43ba0785-hzlrj5-<topic>) nightly only
    if: ${{ needs.plan.outputs.set != 'workstream' || github.ref_name == 'ccr-43ba0785-hzlrj5-cluster' }}
