name: CI
on:
  push:
    branches:
      - master
      # Prototype only (MOD-I74): run CI on the modernization
      # integration branches. Drop this line before upstreaming.
      - 'ccr-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Prototype only (MOD-D30): a newer push to a workstream branch (ccr-43ba0785-hzlrj5-<topic>)
  # cancels the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'ccr-43ba0785-hzlrj5-') }}

jobs:
  test:
    name: "${{ matrix.platform }} with Java ${{ matrix.java-distribution }} version ${{ matrix.java-version }}"
    strategy:
      fail-fast: false
      # Prototype only (MOD-D30): a push to a workstream branch (ccr-43ba0785-hzlrj5-<topic>) runs one
      # Linux leg to spare the account's runners. A manual run on a workstream branch (such as a
      # landing check), master, pull requests and the integration branch run the full matrix:
      # ubuntu x temurin/zulu/corretto, plus windows and macos on temurin.
      matrix: ${{ fromJSON(startsWith(github.ref_name, 'ccr-43ba0785-hzlrj5-') && github.event_name != 'workflow_dispatch' && '{"include":[{"platform":"ubuntu-latest","java-distribution":"temurin","java-version":11}]}' || '{"platform":["ubuntu-latest"],"java-distribution":["temurin","zulu","corretto"],"java-version":[11],"include":[{"platform":"windows-latest","java-distribution":"temurin","java-version":11},{"platform":"macos-latest","java-distribution":"temurin","java-version":11}]}') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap gradle.properties
        run: cp gradle.properties.example gradle.properties
        shell: bash
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ matrix.java-distribution }}
          # 21 runs the Gradle daemon (gradle/gradle-daemon-jvm.properties).  The last version
          # listed becomes JAVA_HOME, which runs Tomcat, HSQLDB and the data tools.
          java-version: |
            21
            ${{ matrix.java-version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_21_ARM64" >> "$gradle_user_home/gradle.properties"
        shell: bash
      # :buildSrc:test runs the removed-API scanner's seeded-fault tests; 'build' only builds buildSrc's jar
      - name: Build
        run: ./gradlew -i -S build :buildSrc:test
      - name: Tomcat Install
        run: ./gradlew -i -S tomcatInstall
      - name: Start Tomcat
        run: ./gradlew -i -S tomcatStart
      - name: Stop Tomcat
        run: ./gradlew -i -S tomcatStop
      - name: Clear Logs Tomcat
        run: ./gradlew -i -S tomcatClearLogs
      - name: Start Database
        run: ./gradlew -i -S hsqlStart
      - name: Init Data
        run: ./gradlew -i -S dataInit
      - name: Stop Database
        run: ./gradlew -i -S hsqlStop
      - name: Generate Skin
        run: ./gradlew -i -S skinGenerate -DskinName=test

  playwright:
    name: "Playwright E2E tests"
    # Prototype only (MOD-D30, MOD-I74): the ccr-* branches carry data and specs that need
    # unreleased uPortal (MOD-I135), and the Integration workflow runs Playwright there against
    # uPortal built from source, so this released-uPortal run is skipped on every ccr-* branch.
    # It still runs on master and pull requests.
    if: ${{ !startsWith(github.ref_name, 'ccr-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap gradle.properties
        run: cp gradle.properties.example gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          # setup-gradle may move GRADLE_USER_HOME (D:\a\.gradle on Windows runners)
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: Initialize portal
        run: ./gradlew -i -S portalInit
      - name: Start Tomcat
        run: ./gradlew -i -S tomcatStart
      - name: Wait for portal
        run: |
          echo "Waiting for uPortal to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/uPortal/ | grep -qE "200|302"; then
              echo "Portal is ready"
              break
            fi
            echo "Attempt $i/60 - waiting 2s..."
            sleep 2
          done
          if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/uPortal/ | grep -qE "200|302"; then
            echo "Portal did not become ready after 120s. Failing the build."
            exit 1
          fi
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --config=tests/uportal-pw.config.ts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
      - name: Stop Tomcat
        if: always()
        run: ./gradlew -i -S tomcatStop

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the commits to check
        id: range
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # The commits this push or pull request adds; a new branch is checked from the
          # commit that added each script onwards.
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..HEAD"
          elif [ -n "$EVENT_BEFORE" ] && ! [[ "$EVENT_BEFORE" =~ ^0+$ ]] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            range="$EVENT_BEFORE..HEAD"
          else
            range=HEAD
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - name: Check Conventional Commit subjects
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: .github/scripts/check-commit-messages.sh "$RANGE"
      - name: Check commit messages for AI writing tells (Vale, MOD-D35)
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: .github/scripts/vale.sh commits "$RANGE"

  prose:
    name: Prose (Vale)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the 6.0 docs for AI writing tells (Vale, MOD-D35)
        # Lints every doc in scope, so a docs-only [skip ci] push is checked by the next run.
        run: .github/scripts/vale.sh docs

  dependency-submission:
    name: Submit dependency graph
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to submit the dependency graph
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap gradle.properties
        run: cp gradle.properties.example gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Gradle 9 runs on 17+;  this job runs no portal, so JAVA_HOME can be the daemon's JDK 21
          java-version: 21
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
