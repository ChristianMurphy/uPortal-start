name: Migration equivalence
#
# MOD-D29 item 1: does uPortal built from source read back exactly the data that uPortal 5.17
# wrote? See docs/migration-equivalence.md and tests/db/equivalence.sh.
#
#   1. builds uPortal (by default the branch of the same name in <owner>/uPortal, else its integration
#      branch feat/uportal-6, else master),
#      as integration.yml does, and hands its ~/.m2 to the other jobs;
#   2. in place: on each database, uPortal 5.17.9 creates the schema, imports the quickstart data
#      and the fixture (tests/db/equivalence/fixture), starts once and exports everything; that
#      export must match tests/db/equivalence/reference. The build under test then starts on the
#      same database and exports again; the two exports must be identical;
#   3. copy: 5.17.9 fills a database on an old server the same way, dbMigrate (from the build under
#      test) copies it into a current server of another vendor, converting the timestamps 5.17
#      stored in the JVM's zone to UTC (MOD-I141), and the build under test, started on the copy,
#      must export exactly what 5.17.9 exported from the original. A copy may run in another zone
#      than UTC (matrix.json).
#
# The vendors come from tests/db/equivalence/matrix.json: on the integration branch HSQLDB,
# PostgreSQL 18 and MariaDB 12.3 in place and two cross-vendor copies; on a workstream branch
# (<type>/<topic>, MOD-D30) PostgreSQL 18 in place and one copy; nightly every 6.0
# runtime server in place and a copy from and into every vendor. Differences are shown in the job
# summary and as annotations.
#
on:
  push:
    branches:
      # Prototype only (MOD-I74): run on the modernization integration branches. Drop this
      # trigger before upstreaming.
      # The names are in .github/scripts/branches.sh, and its table test checks this list.
      # 'ccr-*' is the scheme from before 2026-11-10. Drop it when those branches are deleted.
      - 'ccr-*'
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
      - 'docs/**'
      - 'test/**'
      - 'build/**'
      - 'refactor/**'
      - 'chore/**'
      - 'perf/**'
      - 'staging/landing-*'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Run the nightly sets: every runtime server in place, a copy from and into every vendor'
        type: boolean
        required: false
        default: false
      uportal-repository:
        description: 'uPortal repository (owner/name) to build; empty means <this owner>/uPortal'
        required: false
        default: ''
      uportal-ref:
        description: 'Branch, tag or commit of uPortal to build; empty means the branch of the same name, else the integration branch (feat/uportal-6), else master'
        required: false
        default: ''
permissions:
  contents: read
env:
  # Prototype only (MOD-D53): a topic branch saves its own Gradle cache. setup-gradle
  # writes the cache only on the default branch by default, and none of our work branches is that
  # one, so no job ever saved or restored a cache. Pull requests keep the action's default.
  # A workflow's env can't run branches.sh. So one of our branches is a name with a slash
  # (fix/<topic>, feat/uportal-6, staging/landing-<n>) or the older ccr-*. The ref name of a
  # pull request has a slash too (<number>/merge).
  GRADLE_CACHE_READ_ONLY: ${{ github.event.repository.default_branch != github.ref_name && !startsWith(github.ref_name, 'ccr-') && (github.event_name == 'pull_request' || !contains(github.ref_name, '/')) }}
  # Prototype only (MOD-D53): the first job of a key to finish saves its Gradle cache, and an entry
  # is never replaced. So one job per runner OS and set of build files saves it, the one whose
  # Gradle work is the broadest, and the other jobs of the key only read (this variable). On the
  # default branch and in pull requests every job keeps the action's default.
  GRADLE_CACHE_READ_ONLY_SHARED: ${{ github.event.repository.default_branch != github.ref_name }}
concurrency:
  # A group holds one running and one pending run, and a newer pending run cancels the older one.
  # The nightly sets get their own group, so that a push to the same branch can't cancel them.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || 'push' }}
  # Prototype only (MOD-D30): a newer push to a workstream branch (<type>/<topic>)
  # cancels the older run.
  cancel-in-progress: ${{ startsWith(github.ref_name, 'ccr-43ba0785-hzlrj5-') || (contains(github.ref_name, '/') && github.ref_name != 'feat/uportal-6' && github.event_name != 'pull_request') }}

jobs:
  # Prototype only: on the integration branch and on a staging branch
  # (staging/landing-<n>), asks whether the slow jobs of this workflow already passed
  # for this tree and the uPortal commit it builds (.github/scripts/staged.sh). They are skipped
  # when they did, and the notice of this job gives the run that passed.
  staged:
    name: Staging check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # to list the markers that earlier runs uploaded
    outputs:
      kind: ${{ steps.branch.outputs.kind }}
      skip: ${{ steps.check.outputs.skip }}
      mark: ${{ steps.check.outputs.mark }}
      key: ${{ steps.check.outputs.key }}
      uportal-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # integration, staging, topic or other (.github/scripts/branches.sh), for the jobs below
      - name: Which kind of branch is this
        id: branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          kind=$(.github/scripts/branches.sh kind "$BRANCH")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "::notice title=Branch kind::$BRANCH is $kind"
      # The key covers the uPortal commit that such a push builds: the branch of the same name,
      # else the integration branch (choose-uportal.sh).
      - name: Choose the uPortal repository and ref
        id: source
        if: ${{ github.event_name == 'push' && (steps.branch.outputs.kind == 'integration' || steps.branch.outputs.kind == 'staging') }}
        env:
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        # Without a uPortal commit there is no key, and the jobs run
        run: .github/scripts/choose-uportal.sh || echo "::warning title=Staging check::Could not choose the uPortal commit"
      - name: Did the slow jobs already pass for this tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: migration-equivalence
          UPORTAL_URL: https://github.com/${{ steps.source.outputs.repository }}
          UPORTAL_SHA: ${{ steps.source.outputs.sha }}
        run: .github/scripts/staged.sh check

  uportal:
    name: "Build uPortal"
    needs: staged
    if: ${{ needs.staged.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # to check out the plan files
      actions: read # to list and download earlier runs' uPortal builds (find-uportal-build.sh, MOD-I342)
    outputs:
      artifact: ${{ steps.reuse.outputs.artifact }}
      version: ${{ steps.uportal.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      in-place: ${{ steps.matrix.outputs.in-place }}
      copy: ${{ steps.matrix.outputs.copy }}
    steps:
      # The planning of the database jobs (MOD-I303) runs first in this job, not in a job of its
      # own that the build would wait for. It needs only the test files of this repository.
      - name: Checkout the plan files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tests/db/equivalence
            tests/db/migrate
            tests/db/vendors
          path: plan
      - name: Test the code page conversion of the fixture (MOD-I196)
        working-directory: plan
        run: python3 -B -m unittest discover -s tests/db/equivalence -p 'test_*.py'
      # Prototype only (MOD-D30): a workstream branch runs the light set. A staging branch
      # (staging/landing-<n>) runs the set of the integration branch.
      - name: Choose the push, workstream or nightly set
        id: matrix
        working-directory: plan
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
          WORKSTREAM: ${{ needs.staged.outputs.kind == 'topic' }}
        run: |
          set_name=push
          if [ "$NIGHTLY" = true ]; then
            set_name=nightly
          elif [ "$WORKSTREAM" = true ]; then
            set_name=workstream
          fi
          node tests/db/equivalence/matrix.mjs "$set_name" >> "$GITHUB_OUTPUT"
          echo "::notice title=Migration equivalence set::$set_name"
      - name: Choose the uPortal repository and ref
        id: source
        env:
          INPUT_REPOSITORY: ${{ inputs.uportal-repository }}
          INPUT_REF: ${{ inputs.uportal-ref }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: plan/.github/scripts/choose-uportal.sh
      # Reuse an earlier run's build of the same uPortal commit, if there is one (MOD-I342)
      - name: Find an earlier build of this uPortal commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPORTAL_REPOSITORY: ${{ steps.source.outputs.repository }}
          UPORTAL_SHA: ${{ steps.source.outputs.sha }}
        run: plan/.github/scripts/find-uportal-build.sh
      - name: Checkout uPortal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha || steps.source.outputs.ref }}
          persist-credentials: false
      # Build with the JDK major version and vendor uPortal's .sdkmanrc names
      - name: Read uPortal's JDK
        id: jdk
        run: |
          sdk=$(sed -n 's/^java=//p' .sdkmanrc | tr -d '\r')
          version=${sdk%%.*}
          case "${sdk##*-}" in
            amzn) distribution=corretto ;;
            zulu) distribution=zulu ;;
            *) distribution=temurin ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+$ ]]; then
            echo "Cannot read the JDK from uPortal's .sdkmanrc ('$sdk')" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"
      - name: Download the earlier build
        if: ${{ steps.reuse.outputs.run-id != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          path: ~/.m2/repository/org/jasig/portal
          run-id: ${{ steps.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      # Used only if it names the chosen repository and commit; otherwise uPortal is built
      - name: Check the earlier build's commit
        id: earlier
        if: ${{ steps.reuse.outputs.run-id != '' }}
        env:
          EXPECTED: ${{ steps.source.outputs.repository }}@${{ steps.source.outputs.sha }}
          RUN: ${{ steps.reuse.outputs.run-id }}
        run: |
          built=$(cat ~/.m2/repository/org/jasig/portal/uportal-build.txt 2> /dev/null || true)
          if [ "$built" = "$EXPECTED" ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=uPortal build reused::$EXPECTED, built in run $RUN"
          else
            echo "The build of run $RUN is of '$built', not $EXPECTED, so uPortal is built"
            rm -rf ~/.m2/repository/org/jasig/portal
          fi
      - name: Setup Java
        if: ${{ steps.earlier.outputs.reused != 'true' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ steps.jdk.outputs.distribution }}
          java-version: ${{ steps.jdk.outputs.version }}
      - name: Setup Gradle
        if: ${{ steps.earlier.outputs.reused != 'true' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          # No Gradle cache for the uPortal build: it saved 0.49 GB per branch, and with
          # earlier builds reused (MOD-I342) a build is rare (MOD-I348)
          cache-disabled: true
      - name: Build and install uPortal
        if: ${{ steps.earlier.outputs.reused != 'true' }}
        run: ./gradlew --no-daemon --no-parallel -PquietCompile install
      - name: Mark the build with its commit
        if: ${{ steps.earlier.outputs.reused != 'true' }}
        env:
          BUILT: ${{ steps.source.outputs.repository }}@${{ steps.source.outputs.sha }}
        run: echo "$BUILT" > ~/.m2/repository/org/jasig/portal/uportal-build.txt
      - name: Read the uPortal version
        id: uportal
        env:
          REPOSITORY: ${{ steps.source.outputs.repository }}
          REF: ${{ steps.source.outputs.ref }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if ! [[ "$version" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "Unexpected uPortal version '$version'" >&2
            exit 1
          fi
          ls ~/.m2/repository/org/jasig/portal/uPortal-webapp/"$version"/
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built uPortal $version from $REPOSITORY@$REF ($(git rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the uPortal build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          path: ~/.m2/repository/org/jasig/portal/
          if-no-files-found: error
          retention-days: 7
      # The last lines of the job's log say which uPortal was built, because agents can't read the
      # job summary (MOD-I307)
      - name: Say which uPortal was built
        if: ${{ !cancelled() }}
        env:
          UPORTAL: ${{ steps.source.outputs.description }}
          VERSION: ${{ steps.uportal.outputs.version }}
          REUSED: ${{ steps.earlier.outputs.reused == 'true' && steps.reuse.outputs.run-id || '' }}
          IN_PLACE: ${{ steps.matrix.outputs.in-place }}
          COPY: ${{ steps.matrix.outputs.copy }}
        run: |
          echo "uPortal under test: ${UPORTAL:-none chosen}"
          echo "Built uPortal ${VERSION:-(no build)}${REUSED:+ in run $REUSED, reused}"
          echo "In place: $IN_PLACE"
          echo "Copy: $COPY"

  in-place:
    name: "In place: ${{ matrix.vendor }}"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.uportal.outputs.in-place) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.uportal.outputs.artifact }}
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY_SHARED }}
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: 5.17.9 writes, the build under test reads on the same database
        env:
          VENDOR: ${{ matrix.vendor }}
        run: tests/db/equivalence.sh in-place "$VENDOR" -- -PdbWaitSeconds=600
      - name: Upload the exports, reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equivalence-in-place-${{ matrix.vendor }}
          path: |
            build/db-equivalence/
            .gradle/tomcat/logs/

  copy:
    name: "Copy: ${{ matrix.source }} to ${{ matrix.target }}${{ matrix.zone && format(' in {0}', matrix.zone) || '' }}"
    needs: uportal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.uportal.outputs.copy) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the uPortal build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.uportal.outputs.artifact }}
          path: ~/.m2/repository/org/jasig/portal
      - name: Bootstrap gradle.properties for the uPortal build
        env:
          UPORTAL_VERSION: ${{ needs.uportal.outputs.version }}
        run: |
          cp gradle.properties.example gradle.properties
          sed -i "s/^uPortalVersion=.*/uPortalVersion=$UPORTAL_VERSION/" gradle.properties
          grep '^uPortalVersion=' gradle.properties
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 runs the Gradle daemon and dbMigrate; 11 (listed last, so JAVA_HOME) runs the portal
          java-version: |
            21
            11
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY_SHARED }}
      - name: Point Gradle at the JDK 21 for its daemon
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> "$gradle_user_home/gradle.properties"
      - name: 5.17.9 writes the source, dbMigrate copies it, the build under test reads the copy
        env:
          SOURCE: ${{ matrix.source }}
          TARGET: ${{ matrix.target }}
          # The zone of every JVM in the run, which the copy converts 5.17's local times from
          # (MOD-I141)
          EQUIVALENCE_ZONE: ${{ matrix.zone || 'UTC' }}
        run: tests/db/equivalence.sh copy "$SOURCE" "$TARGET" -- -PdbWaitSeconds=600
      - name: Upload the exports, reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equivalence-copy-${{ matrix.source }}-to-${{ matrix.target }}
          path: |
            build/db-equivalence/
            build/db-migrate/
            .gradle/tomcat/logs/

  # Prototype only: a full run on the integration branch or a staging branch records that the slow
  # jobs passed for this tree. The marker is an artifact that staged.sh looks for. This job runs
  # only when every job it needs passed.
  staged-mark:
    name: Record the pass for this tree
    needs: [staged, uportal, in-place, copy]
    if: ${{ needs.staged.outputs.mark == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the marker
        id: marker
        env:
          KEY: ${{ needs.staged.outputs.key }}
          BRANCH: ${{ github.ref_name }}
          KEY_UPORTAL: ${{ needs.staged.outputs.uportal-sha }}
          BUILT_UPORTAL: ${{ needs.uportal.outputs.sha }}
        run: |
          # The key stands for the uPortal commit that the staging check chose. The build chose
          # again, later, so the two can differ when uPortal's branch moved in between.
          if [ -z "$BUILT_UPORTAL" ] || [ "$BUILT_UPORTAL" != "$KEY_UPORTAL" ]; then
            echo "::warning title=Staging check::No marker: the key is for uPortal ${KEY_UPORTAL:-(none)}, and the jobs tested ${BUILT_UPORTAL:-(none)}"
            exit 0
          fi
          mkdir marker
          {
            echo "workflow=migration-equivalence"
            echo "key=$KEY"
            echo "repository=$GITHUB_REPOSITORY"
            echo "branch=$BRANCH"
            echo "commit=$GITHUB_SHA"
            echo "uportal=$BUILT_UPORTAL"
            echo "run=$GITHUB_RUN_ID"
          } > marker/staged.txt
          cat marker/staged.txt
          echo "written=true" >> "$GITHUB_OUTPUT"
      - name: Upload the marker
        if: ${{ steps.marker.outputs.written == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-migration-equivalence-${{ needs.staged.outputs.key }}
          path: marker/staged.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 30
