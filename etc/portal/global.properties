##
## global.properties
## -----------------
##
## In this file, you can manage all the same properties as uPortal.properties with one key
## difference:  this file may be sourced by uPortal modules (e,g, portlets) as well as by uPortal
## itself.  This file is an excellent place to manage configuration that is shared between uPortal
## and one or more modules (e.g. database connection settings).
##
##
## Please keep the formatting of this properties file as follows:
##
##   ##
##   ## Comment line 1
##   ## Comment line 2, etc
##   ##                     <-- (leave a blank commented line)
##   property_name=property_value
##                          <-- (leave a blank line...
##                          <--  or two blank lines before a new section)
##
## Leave properties that you do not wish to overrride commented-out with a single '#' and set to
## the default value (for reference).
##
## Port numbers written as at-sign tokens below are filled in from the tomcatHttpPort and hsqlPort
## Gradle properties when uPortal-start copies this file into portal.home (see README.md).
##


################################################################################
##                                                                            ##
##                             Database Connection                            ##
##                                                                            ##
################################################################################

##
## Not all modules bundled with uPortal require a database connection;  but all the ones that do use
## the same properties to connect.  These property names are standard for Hibernate-based
## persistence in Java projects.
##
## You can optionally configure any module to use different connection settings from the standard
## ones (defined here) by adding these properties to the module-specific file in portal.home
## (e.g. announcements.properties).
##
hibernate.connection.driver_class=org.hsqldb.jdbc.JDBCDriver
hibernate.connection.url=jdbc:hsqldb:hsql://localhost:@hsqlPort@/uPortal
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.connection.validationQuery=select 1 from INFORMATION_SCHEMA.SYSTEM_USERS
hibernate.dialect=org.hibernate.dialect.HSQLDialect

## Connection budget (docs/connection-budget.md): the portal and the bundled portlets open at most
## 110 connections together; set PostgreSQL's max_connections to 150. Each page holds a connection
## while its portlets render, and each portlet render takes another, so PortalDb needs 60 for 16
## people using the portal at once. maxActive is the most a pool opens. Announcements (10),
## NotificationPortlet (8) and SimpleContentPortlet (5) fix their pool sizes in the portlet;
## Bookmarks, Calendar and Feedback open one connection per request.
tomcat.jdbc.pool.PortalDb.initialSize=1
tomcat.jdbc.pool.PortalDb.minIdle=1
tomcat.jdbc.pool.PortalDb.maxIdle=20
tomcat.jdbc.pool.PortalDb.maxActive=60
tomcat.jdbc.pool.rawEventsDataSource.initialSize=1
tomcat.jdbc.pool.rawEventsDataSource.minIdle=1
tomcat.jdbc.pool.rawEventsDataSource.maxIdle=2
tomcat.jdbc.pool.rawEventsDataSource.maxActive=5
tomcat.jdbc.pool.aggrEventsDataSource.initialSize=1
tomcat.jdbc.pool.aggrEventsDataSource.minIdle=1
tomcat.jdbc.pool.aggrEventsDataSource.maxIdle=2
tomcat.jdbc.pool.aggrEventsDataSource.maxActive=5
tomcat.jdbc.pool.newsReaderDataSource.initialSize=1
tomcat.jdbc.pool.newsReaderDataSource.minIdle=1
tomcat.jdbc.pool.newsReaderDataSource.maxIdle=4
tomcat.jdbc.pool.newsReaderDataSource.maxActive=8


####################################################################
##                                                                ##
##         Required to share configuration with portlets          ##
##         e.g. esup-filemanager                                  ##
##                                                                ##
####################################################################
## Portal Server
portal.protocol=http
portal.server=localhost:@tomcatHttpPort@
portal.context=/uPortal
# Needed for proxy-cas in load-balanced system like Apache to return the
# proxy-ticket to the requesting server. It requires that the load-balanced
# instance has his serverName
# Example: my.univ.edu
portal.lbServerName=${portal.server}

## Central Authentication Service (CAS):  not used by default (local login).  -PauthMode=cas
## appends the settings for casServerUrl from etc/cas/global.properties (docs/authentication.md).
#cas.protocol=http
