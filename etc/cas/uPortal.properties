##
## authMode=cas (gradle/tasks/auth.gradle appends this block to uPortal.properties in portal.home);
## overrides the local-login settings above.  cas.protocol.server.context is built from the
## cas.protocol, cas.server and cas.context settings in global.properties.
##

# Accept CAS service tickets at /Login
org.apereo.portal.security.provider.cas.CasAssertionSecurityContextFactory.enabled=true

# The Sign In button goes to CAS, which sends the user back to /Login with a ticket
org.apereo.portal.channels.CLogin.CasLoginUrl=${cas.protocol.server.context}/login?service=${portal.login.url}

# Signing out of the portal also ends the CAS single sign-on session, then returns to the portal
logout.redirect=${cas.protocol.server.context}/logout?service=${portal.protocol.server.context}/

# Ask CAS for a proxy-granting ticket, so portlets can get proxy tickets (cas-proxy-test-portlet,
# esup-filemanager).  CAS calls the callback back over the network:  it must reach the portal.
cas.ticketValidationFilter.proxyReceptorUrl=/CasProxyServlet
cas.ticketValidationFilter.ticketValidator.proxyCallbackUrl=${portal.protocol}://${portal.server}${portal.context}${cas.ticketValidationFilter.proxyReceptorUrl}
